services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trident
      POSTGRES_PASSWORD: trident_poc
      POSTGRES_DB: trident
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trident"]
      interval: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://trident:trident_poc@db:5432/trident
      COPILOT_PROVIDER_BASE_URL: ${COPILOT_PROVIDER_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      COPILOT_PROVIDER_API_KEY: ${COPILOT_PROVIDER_API_KEY:-}
      COPILOT_MODEL: ${COPILOT_MODEL:-gemini-2.5-flash}
      SESSION_SECRET: ${SESSION_SECRET:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:

# OpenEvolve config: evolves a third TRIDENT-Val AVM challenger using the Claude Code CLI as
# the LLM backend. No API key needed — authentication uses the CLI's OAuth session.
#
# Prerequisites:
#   1. Install Claude Code CLI: npm install -g @anthropic-ai/claude-code
#   2. Authenticate: claude login
#   3. pip install openevolve scikit-learn pandas numpy joblib (into whatever env you run
#      openevolve-run.py from — this is tooling, not a runtime dependency of the app)
#
# Run (see scripts/evolve_challenger.py for the full orchestration, including materializing
# the winning program into model/evolved_v1/):
#   python openevolve-run.py scripts/evolve/initial_program.py scripts/evolve/evaluator.py \
#     --config scripts/evolve/config.yaml --output scripts/evolve/openevolve_output

max_iterations: 15
checkpoint_interval: 5

llm:
  provider: "claude_code"
  models:
    - name: "sonnet"
      weight: 1.0
      max_tokens: 16000
      timeout: 300
      max_budget_usd: 1.0
  retries: 2
  retry_delay: 5

prompt:
  system_message: >
    You are optimizing a regression model that predicts residential property sale prices
    for TRIDENT-Val, a bank collateral-risk platform. The model registry already has two
    models: a LightGBM gradient-boosted-tree champion (holdout MAPE 7.9%, R2 0.94) and a
    Ridge linear challenger. Your job is to evolve build_model into a third, genuinely
    different architecture that earns its place as an independent challenger precisely
    because it fails differently than the other two — while still being as accurate as
    you can make it.

    HARD CONSTRAINTS (violating these scores 0):
    - Only use scikit-learn, pandas, and numpy. Do NOT import lightgbm, xgboost, catboost,
      torch, tensorflow, or any package not already imported in the file.
    - Keep the function signature exactly:
      build_model(X_train, y_train, categories, numeric_ordinal, categorical) -> fitted estimator
    - The returned object must expose .predict(X) and predict log1p(SalePrice) given a
      DataFrame with the same columns/dtypes as X_train (categorical columns are pandas
      `category` dtype using the categories given in the `categories` dict).
    - Keep fit time well under a few seconds on ~2,300 training rows / 26 features — this
      runs every generation.
    - No network access, no file I/O beyond what's already provided.

    GOOD DIRECTIONS: bagged/randomized tree ensembles (RandomForest, ExtraTrees), boosting
    without LightGBM (GradientBoostingRegressor, HistGradientBoostingRegressor), distance or
    kernel-based methods (KNeighborsRegressor, SVR), engineered interaction/ratio features on
    top of any of these, or a small blended/stacked ensemble of a few of them. Favor an
    architecture whose errors would plausibly diverge from a boosted-tree champion and a
    linear challenger, not a third copy of either.

database:
  population_size: 20
  archive_size: 10
  num_islands: 2
  elite_selection_ratio: 0.2
  exploitation_ratio: 0.7
  similarity_threshold: 0.99

evaluator:
  timeout: 120
  cascade_evaluation: false
  parallel_evaluations: 1

diff_based_evolution: true
max_code_length: 20000

name: Deploy to Cloud Run

# Builds the backend and frontend images and deploys them to the single two-container
# Cloud Run service Terraform created (ats-avm-jam; see docs/runbooks/deploy-ats-avm-jam.md) (see terraform/). Infra changes themselves are
# applied by hand with `terraform apply` — this workflow only ever swaps the
# running image, matching the `lifecycle.ignore_changes` on image in
# terraform/cloud_run.tf so the two don't fight each other.
#
# Requires these repository variables (Settings > Secrets and variables >
# Actions > Variables) sourced from `terraform output` after the first apply —
# see docs/deployment.md:
#   GCP_PROJECT_ID, GCP_REGION, GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_DEPLOYER_SA
# No secrets are needed: auth is via Workload Identity Federation, not a
# stored key.

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "model/**"
      - "scripts/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-cloud-run
  cancel-in-progress: false

env:
  APP_NAME: trident-val

jobs:
  build-and-push:
    name: Build & push (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: backend
            context: .
            dockerfile: backend/Dockerfile
          - service: frontend
            context: ./frontend
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Set image tag
        id: image
        run: |
          IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.APP_NAME }}/${{ matrix.service }}:${{ github.sha }}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.image.outputs.image }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          # Same deterministic tags the build jobs just pushed. One service, two
          # containers (frontend = ingress, backend = sidecar); --container scopes the
          # following --image to that named container, leaving env/secrets untouched.
          REPO="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.APP_NAME }}"
          gcloud run deploy "${{ env.APP_NAME }}"             --region="${{ vars.GCP_REGION }}"             --project="${{ vars.GCP_PROJECT_ID }}"             --container=frontend --image="${REPO}/frontend:${{ github.sha }}"             --container=backend --image="${REPO}/backend:${{ github.sha }}"             --quiet

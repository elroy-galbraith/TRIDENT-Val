databases:
  - name: trident-val-db
    databaseName: trident
    user: trident
    plan: free

services:
  # FastAPI + LightGBM/Ridge inference, built from the same Dockerfile used by
  # docker-compose. Free-tier web services spin down after 15 min idle and take
  # a few seconds to wake back up on the next request.
  - type: web
    name: trident-val-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /docs
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trident-val-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "true"
      # Optional: fill these in from the Render dashboard to enable the AI
      # copilot / AI-drafted report narrative. Leave blank and both features
      # degrade gracefully (see .env.example).
      - key: COPILOT_PROVIDER_API_KEY
        sync: false
      - key: REPORT_LLM_PROVIDER_API_KEY
        sync: false

  # Static React/Tailwind build. Proxies /api/* server-side to the backend so
  # the browser only ever talks to this domain, keeping the session cookie
  # same-origin (mirrors the nginx proxy_pass used in docker-compose).
  - type: web
    name: trident-val-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://trident-val-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
